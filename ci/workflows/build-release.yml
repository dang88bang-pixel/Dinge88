name: 🛡️ Build SecureGuard APK

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Zu bauender APK-Typ'
        type: choice
        required: false
        default: 'all'
        options:
          - all
          - debug
          - release

# Nur der neueste Lauf pro Branch/Ref wird ausgeführt; überholte werden abgebrochen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  COMPILE_SDK: '35'
  BUILD_TOOLS: '35.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: assembleDebug
            artifact: secureguard-pro-debug
            retention: 14
          - task: assembleRelease
            artifact: secureguard-pro
            retention: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # Gradle Wrapper validieren + Dependency-/Wrapper-Cache (großer Speedup).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Android-SDK über die offizielle Action. Sie setzt ANDROID_HOME und
      # ANDROID_SDK_ROOT, installiert die cmdline-tools und akzeptiert die
      # Google-Lizenzen automatisch.
      #
      # Ersetzt das frühere Handskript, das die Versionsnummer der cmdline-tools
      # aus dl.google.com/.../repository2-1.xml gegrept hat. Das war aus drei
      # Gründen fragil: es bricht, sobald Google das XML umbaut, es scheitert
      # still hinter Proxies, und der nachgelagerte actions/cache-Schritt lag
      # HINTER der Installation und konnte deshalb nie etwas beschleunigen.
      - name: Android-SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}

      # Release-Keystore aus Secret dekodieren (nur für Release-Builds).
      - name: Decode Keystore
        if: matrix.task == 'assembleRelease'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/secureguard-keystore.jks
            echo "Keystore written (size: $(wc -c < app/secureguard-keystore.jks) bytes)."
          else
            echo "::warning::KEYSTORE_BASE64 is not set - APK wird UNSIGNIERT gebaut."
          fi

      # Signing-Konfiguration nur dann anwenden, wenn der Keystore existiert.
      - name: Prepare signing config
        if: matrix.task == 'assembleRelease'
        run: |
          if [ -f "app/secureguard-keystore.jks" ]; then
            echo "SG_HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "SG_HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build ${{ matrix.task }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew ${{ matrix.task }} --no-daemon --stacktrace

      # APK benennen + Prüfsumme berechnen.
      - name: Prepare APK artifacts
        run: |
          mkdir -p apk-out
          cp app/build/outputs/apk/release/*.apk apk-out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk apk-out/ 2>/dev/null || true
          cd apk-out
          sha256sum *.apk > SHA256SUMS.txt
          ls -la

      - name: Upload APK (${{ matrix.artifact }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: ${{ matrix.retention }}

      - name: Upload SHA256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-checksums
          path: apk-out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: ${{ matrix.retention }}

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: secureguard-pro
          path: ./apk

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: secureguard-pro-checksums
          path: ./apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🛡️ SecureGuard Pro ${{ github.ref_name }}"
          body: |
            ## 🛡️ SecureGuard Enterprise

            ### ✅ Funktionen
            - 📡 LoRa/LoRaWAN
            - 🧠 Selbstlernender Agent
            - 🗺️ OpenStreetMap-Karte
            - 🎮 Fernsteuerung (Alarm, Motor, Batterie)
            - 👁️ Optische Erkennung
            - 🌍 Apple/Google Crowdsourcing (nur mit Einwilligung)
            - 🏙️ Urbane Infrastruktur
            - 📡 GPS/GLONASS/Galileo
            - 🔒 DSGVO-konform

            ### 📦 Download
            - **APK**: `secureguard-pro.apk`

            ### 🔑 Signatur
            - APK **signiert**, wenn die Keystore-Secrets gesetzt sind.
            - Sonst wird eine **unsignierte** APK erzeugt (`app-release-unsigned.apk`).

            > 🔐 Prüfsummen siehe `SHA256SUMS.txt` im Release.
          files: |
            ./apk/*.apk
            ./apk/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
