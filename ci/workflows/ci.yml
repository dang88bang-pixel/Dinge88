name: CI

# Zweck: schnelle Rückmeldung auf JEDEN Push – auch auf Agenten- und
# Feature-Branches. `build-release.yml` baut nur auf main/develop/Tags und ist
# damit als Regressionsnetz zu spät dran.
#
# Wichtig für Self-Hosted Runner: dieser Workflow installiert JDK und Android-SDK
# ausschließlich über die offiziellen Actions (setup-java, setup-android). Die
# akzeptieren die Google-Lizenzen automatisch und setzen JAVA_HOME/ANDROID_HOME
# selbst – manuelles Herunterladen von dl.google.com entfällt und damit auch die
# häufigste Fehlerquelle hinter Firewalls und Proxies.
#
# Falls der Runner hinter einem Proxy steht, müssen HTTP_PROXY/HTTPS_PROXY in der
# Umgebung des Agenten-Dienstes gesetzt sein; ausgehend erreichbar sein müssen
# github.com (inkl. der Actions-Artefakt-Buckets), dl.google.com und
# repo.maven.apache.org.

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  COMPILE_SDK: '35'
  BUILD_TOOLS: '35.0.0'

jobs:
  # Läuft als erstes und in Sekunden: Wenn Android, 3D-Konsole und Firmware
  # unterschiedliche Befehle sprechen, ist jeder nachfolgende grüne Build
  # wertlos – die Bedienerin drückt dann Knöpfe, die das Gerät nicht kennt.
  contract:
    name: Befehlssatz – Drift zwischen App, Konsole und Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aktions-Katalog vergleichen
        run: python3 scripts/check-action-drift.py --verbose

  android:
    name: Android – kompilieren und testen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK ${{ env.JAVA_VERSION }} einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # Setzt ANDROID_HOME/ANDROID_SDK_ROOT, installiert die cmdline-tools und
      # akzeptiert die SDK-Lizenzen. Ersetzt das frühere Handskript.
      - name: Android-SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}

      # Validiert den Gradle-Wrapper und übernimmt das Caching von
      # ~/.gradle/caches und ~/.gradle/wrapper.
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle-Wrapper ausführbar machen
        run: chmod +x gradlew

      - name: Umgebung protokollieren
        run: |
          echo "JAVA_HOME   = $JAVA_HOME"
          java -version
          echo "ANDROID_HOME= $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ./gradlew --version

      - name: Debug-APK bauen
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Unit-Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # Lint ist bewusst noch nicht blockierend: der Bestand ist nicht
      # nachweislich sauber. Der Bericht wird hochgeladen, damit die Schulden
      # sichtbar sind. Sobald er grün ist, `continue-on-error` entfernen.
      - name: Android Lint
        id: lint
        continue-on-error: true
        run: ./gradlew :app:lint --no-daemon --continue

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: secureguard-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  console3d:
    name: 3D Operations Center – bauen und Bundle-Drift prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: console3d/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: console3d
        run: npm ci

      # 132 Tests: Katalog, Store, Simulation, Geo, Native-Bridge und das
      # komplette HUD (Auswahl, Aktionen, Bestätigung, Tastatur, Palette,
      # Alarme, Warteschlange) gegen das echte index.html in jsdom.
      - name: Tests ausführen
        working-directory: console3d
        run: npm test

      - name: Bundle bauen
        working-directory: console3d
        run: npm run build

      # Die App lädt das 3D-Lagebild offline aus app/src/main/assets/console3d/.
      # Läuft dieses Bundle der Quelle davon, liefert die App eine alte Konsole
      # aus – und nichts schlägt fehl. Genau das fängt dieser Schritt ab.
      - name: Bundle gegen App-Assets prüfen
        run: |
          if ! diff -r console3d/dist app/src/main/assets/console3d > /tmp/drift.txt; then
            echo "::error::Das Bundle in app/src/main/assets/console3d ist nicht aktuell."
            echo "Beheben mit: bash scripts/sync-console3d.sh && git add app/src/main/assets/console3d"
            cat /tmp/drift.txt
            exit 1
          fi
          echo "Bundle ist aktuell."

      - name: Bundle-Größe berichten
        run: |
          echo "### 3D-Konsole" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh console3d/dist >> "$GITHUB_STEP_SUMMARY"
          find console3d/dist -name '*.js' -o -name '*.css' | while read -r f; do
            printf '%-45s %8s  gzip %8s\n' \
              "${f#console3d/dist/}" \
              "$(du -h "$f" | cut -f1)" \
              "$(gzip -c "$f" | wc -c | numfmt --to=iec)" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend – Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Tests
        run: pytest backend/tests -q

      # Rauchtest der Bereitstellung: Backend hochfahren, Demo-Flotte einspielen,
      # Kennzahlen prüfen. Deckt genau den Pfad ab, den die 3D-Konsole nutzt.
      - name: Bereitstellung rauchtesten
        run: |
          DATABASE_PATH=/tmp/ci.db python3 -m uvicorn main:app \
            --host 127.0.0.1 --port 8000 --app-dir backend &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health > /dev/null && break
            sleep 1
          done
          python3 scripts/seed-demo-data.py --seed 88
          STATS=$(curl -sf http://127.0.0.1:8000/api/stats)
          echo "Stats: $STATS"
          echo "$STATS" | grep -q '"assets": *12' \
            || { echo "::error::Demo-Flotte unvollständig"; exit 1; }
