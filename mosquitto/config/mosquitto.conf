# SecureGuard MQTT-Broker (Mosquitto 2.x)
# ---------------------------------------
# Entwicklungs-/Pilot-Konfiguration. Für den Produktivbetrieb:
#  - anonymen Zugriff deaktivieren (allow_anonymous false)
#  - Benutzer anlegen (mosquitto_passwd)
#  - TLS aktivieren (listener 8883 + certfile/keyfile)

listener 1883
allow_anonymous true

# MQTT over WebSocket (für Node-RED / Browser-Dashboards)
listener 9001
protocol websockets
allow_anonymous true

# Persistenz
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
