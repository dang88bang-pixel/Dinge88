# SecureGuard MQTT-Broker (Mosquitto 2.x)
# ---------------------------------------
# Pilot-Default: anonym auf 1883/9001.
# Produktion: ALLOW_ANONYMOUS=false + Passwort-Datei + TLS.

# Persistenz
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ---- Listener TCP (App / ESP32) ----
listener 1883
protocol mqtt
# Pilot: true. Produktion: false + password_file
allow_anonymous true
# PRODUKTION (Reihenfolge wichtig!):
#   1) User anlegen:      mosquitto_passwd -c mosquitto/config/passwd secureguard
#   2) Erst DANN aktivieren (sonst sperrt eine leere/kommentierte passwd-Datei
#      ALLE Clients – auch die eigene App – aus):
#      allow_anonymous false
#      password_file /mosquitto/config/passwd
#      acl_file /mosquitto/config/acl
#   3) Gateway-User je Device-ID (z. B. "AA:BB:CC:DD:EE:01") via
#      mosquitto_passwd -b mosquitto/config/passwd <user> <pass> ergänzen.

# ---- MQTT over WebSocket (Node-RED / Browser) ----
listener 9001
protocol websockets
allow_anonymous true

# ---- Optional TLS (aktivieren wenn Zertifikate gemountet) ----
# listener 8883
# protocol mqtt
# allow_anonymous false
# password_file /mosquitto/config/passwd
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# require_certificate false
