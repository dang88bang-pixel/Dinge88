name: Build SecureGuard APK

on:
  push:
    branches: [main, develop, 'arena/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: assembleDebug
            artifact: secureguard-pro-debug
            retention: 14
          - task: assembleRelease
            artifact: secureguard-pro
            retention: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: matrix.task == 'assembleRelease'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > secureguard-keystore.jks
            echo "Keystore written ($(wc -c < secureguard-keystore.jks) bytes)."
          else
            echo "::warning::KEYSTORE_BASE64 fehlt – Release-APK wird debug-signiert oder unsigniert."
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build ${{ matrix.task }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew ${{ matrix.task }} --no-daemon --stacktrace

      - name: Collect APK artifacts
        run: |
          mkdir -p apk-out
          find app/build/outputs/apk -name '*.apk' -exec cp {} apk-out/ \;
          test -n "$(ls -A apk-out/*.apk 2>/dev/null)"
          cd apk-out
          sha256sum *.apk > SHA256SUMS.txt
          ls -la

      - name: Upload APK (${{ matrix.artifact }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: ${{ matrix.retention }}

      - name: Upload SHA256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-checksums
          path: apk-out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: ${{ matrix.retention }}

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: secureguard-pro
          path: ./apk

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: secureguard-pro-checksums
          path: ./apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SecureGuard Pro ${{ github.ref_name }}"
          body: |
            ## SecureGuard Enterprise

            Installierbare APK mit vollständiger Benutzeroberfläche
            (Dashboard, Assets, Karte, Aktionen, Einstellungen).

            - Debug-APK: Artefakt `secureguard-pro-debug` (dieser Workflow)
            - Release-APK: `secureguard-pro` (signiert, wenn Keystore-Secrets gesetzt)

            Prüfsummen: `SHA256SUMS.txt`
          files: |
            ./apk/*.apk
            ./apk/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
