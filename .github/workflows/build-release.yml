name: 🛡️ Build SecureGuard APK

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Install the Android SDK cmdline-tools + required packages.
      # (android-actions/setup-android is deprecated and no longer reliable.)
      - name: Install Android SDK
        run: |
          ANDROID_ROOT="$ANDROID_HOME"
          if [ -z "$ANDROID_ROOT" ]; then ANDROID_ROOT="$HOME/android-sdk"; fi
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          CMDLINE_VERSION=$(curl -s https://dl.google.com/android/repository/repository2-1.xml | \
            grep -oP 'commandlinetools-linux-\K[0-9]+' | sort -V | tail -1)
          if [ -z "$CMDLINE_VERSION" ]; then CMDLINE_VERSION=11076708; fi
          curl -fSL -o /tmp/cmdline.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip"
          unzip -q -o /tmp/cmdline.zip -d "$ANDROID_ROOT/cmdline-tools"
          mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

      # Decode the release keystore from a base64-encoded secret.
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/secureguard-keystore.jks
            echo "Keystore written."
          else
            echo "::warning::KEYSTORE_BASE64 is not set - building without a signing keystore."
          fi

      # Ensure the Gradle wrapper is executable.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: secureguard-pro.apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: secureguard-pro.apk
          path: ./apk
      - uses: softprops/action-gh-release@v2
        with:
          name: "🛡️ SecureGuard Pro ${{ github.ref_name }}"
          body: |
            ## 🛡️ SecureGuard Enterprise

            ### ✅ Funktionen
            - 📡 LoRa/LoRaWAN
            - 🧠 Selbstlernender Agent
            - 🗺️ OpenStreetMap-Karte
            - 🎮 Fernsteuerung (Alarm, Motor, Batterie)
            - 👁️ Optische Erkennung
            - 🌍 Apple/Google Crowdsourcing (nur mit Einwilligung)
            - 🏙️ Urbane Infrastruktur
            - 📡 GPS/GLONASS/Galileo
            - 🔒 DSGVO-konform

            ### 📦 Download
            - **APK**: secureguard-pro.apk
          files: |
            ./apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
