name: 🛡️ Build SecureGuard APK

# =====================================================================
# Baut Debug- und Release-APK (Android 8.0+, verifiziert für Android 11–14),
# führt Unit-Tests (JVM/Robolectric), Lint, Backend-Tests und einen
# Emulator-Smoke-Test (API 30 = Android 11, API 34 = Android 14) aus.
#
# APK-Kanäle:
#   1. Workflow-Artefakte (secureguard-pro / secureguard-pro-debug)
#   2. Git-Branches apk-delivery-release / apk-delivery-debug
#      (Task `publishApkDelivery` in app/build.gradle.kts; Abholen mit
#      scripts/fetch-apk.sh → releases/)
#   3. GitHub Release bei Tags v* (nur mit Produktions-Signatur)
#
# Signatur: Produktions-Keystore aus Secret ANDROID_KEYSTORE_BASE64 (oder
# KEYSTORE_BASE64). Fehlt das Secret, signiert Gradle mit dem eingecheckten
# CI-Debug-Keystore (app/keystore/secureguard-ci-debug.p12) → APK bleibt
# installierbar/updatefähig, wird aber als "ci-debug-fallback" markiert.
# Tag-Releases (v*) verlangen zwingend den Produktions-Keystore.
# =====================================================================

on:
  push:
    branches: [ main, develop, 'arena/**', 'agent/**' ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'releases/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Zu bauender APK-Typ'
        type: choice
        required: false
        default: 'all'
        options:
          - all
          - debug
          - release
      run_emulator_smoke:
        description: 'Emulator-Smoke-Tests (API 30/34) ausführen'
        type: boolean
        required: false
        default: true

# Nur der neueste Lauf pro Branch/Ref wird ausgeführt; überholte werden abgebrochen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  COMPILE_SDK: 'android-35'
  BUILD_TOOLS: '35.0.0'

jobs:
  # -------------------------------------------------------------------
  # Plan: welche Build-Typen (workflow_dispatch-Auswahl, sonst beide)
  # -------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - id: plan
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'all' }}
        run: |
          case "$BUILD_TYPE" in
            debug)   echo 'tasks=["assembleDebug"]' >> "$GITHUB_OUTPUT" ;;
            release) echo 'tasks=["assembleRelease"]' >> "$GITHUB_OUTPUT" ;;
            *)       echo 'tasks=["assembleDebug","assembleRelease"]' >> "$GITHUB_OUTPUT" ;;
          esac
          echo "build_type=$BUILD_TYPE"

  # -------------------------------------------------------------------
  # Backend (FastAPI) – schnelle Python-Tests, unabhängig vom Android-Build
  # -------------------------------------------------------------------
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest backend/tests -q

  # -------------------------------------------------------------------
  # Android: Unit-Tests, Lint, APK-Build, Signatur-Verifikation, Delivery
  # -------------------------------------------------------------------
  build:
    name: ${{ matrix.task }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # publishApkDelivery pusht apk-delivery-* Branches
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    env:
      ARTIFACT: ${{ matrix.task == 'assembleRelease' && 'secureguard-pro' || 'secureguard-pro-debug' }}
      RETENTION: ${{ matrix.task == 'assembleRelease' && 30 || 14 }}
    outputs:
      signing_mode_release: ${{ steps.siginfo.outputs.signing_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Android SDK packages
        run: |
          # ubuntu-latest bringt ein vorinstalliertes SDK mit; fehlende Pakete
          # werden nachinstalliert (kein Cache über den SDK-Baum → keine
          # tar-Fehler durch read-only Dateien).
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMAN="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMAN="sdkmanager"
          fi
          yes | "$SDKMAN" --licenses > /dev/null || true
          "$SDKMAN" "platforms;${{ env.COMPILE_SDK }}" "build-tools;${{ env.BUILD_TOOLS }}" "platform-tools"

      # Produktions-Keystore (optional). Unterstützt beide Secret-Namen:
      #   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      #   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD   (Legacy, scripts/create-release-keystore.sh)
      # Ohne Secret: Fallback auf den eingecheckten CI-Debug-Keystore (nur Branch-Builds!).
      - name: Provide release keystore
        if: matrix.task == 'assembleRelease'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEYSTORE_ALIAS || secrets.ANDROID_KEYSTORE_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set +e
          mkdir -p ci-logs
          {
            echo "=== DIAGNOSE KEYSTORE SECRETS ==="
            echo "KEYSTORE_BASE64 Laenge: ${#KEYSTORE_BASE64}"
            echo "KEYSTORE_PASSWORD gesetzt: $([ -n "$KEYSTORE_PASSWORD" ] && echo ja || echo nein)"
            echo "KEY_ALIAS: "$KEY_ALIAS""
            echo "================================="
          } | tee ci-logs/keystore-diag.log
          IS_TAG=0; [[ "${GITHUB_REF}" == refs/tags/v* ]] && IS_TAG=1
          fallback() {
            # $1 = Grund
            rm -f secureguard-keystore.p12 secureguard-keystore.jks
            if [ "$IS_TAG" = "1" ]; then
              echo "::error::Release-Signatur nicht möglich: $1 – Tag-Releases werden nur mit gültigem Produktions-Keystore gebaut (docs/SQLCIPHER_AND_SIGNING.md)."
              exit 1
            fi
            echo "::warning::Release-Signatur: $1 – Release-APK wird mit dem CI-Debug-Keystore signiert (SIGNING_MODE=ci-debug-fallback). Für produktive Auslieferung ANDROID_KEYSTORE_*/KEYSTORE_* Secrets korrekt hinterlegen."
            echo "SIGNING_EXPECTED=ci-debug-fallback" >> "$GITHUB_ENV"
            exit 0
          }
          if [ -z "$KEYSTORE_BASE64" ]; then
            fallback "kein Secret ANDROID_KEYSTORE_BASE64 bzw. KEYSTORE_BASE64 gesetzt"
          fi
          # Base64 dekodieren (Zeilenumbrüche/Whitespace tolerieren)
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > secureguard-keystore.p12 2>/dev/null \
             || [ ! -s secureguard-keystore.p12 ]; then
            fallback "Secret ist kein gültiges Base64 (erwartet: base64 -w0 keystore.p12|.jks)"
          fi
          # Format prüfen: PKCS12 (ASN.1 SEQUENCE 30 82 …) oder JKS (FE ED FE ED)
          MAGIC=$(head -c 4 secureguard-keystore.p12 | od -An -tx1 | tr -d ' \n')
          case "$MAGIC" in
            3082*) ;;
            feedfeed) mv secureguard-keystore.p12 secureguard-keystore.jks ;;
            *) fallback "dekodierte Datei ist weder PKCS12 noch JKS (Magic: $MAGIC)" ;;
          esac
          KS=$(ls secureguard-keystore.p12 secureguard-keystore.jks 2>/dev/null | head -n1)
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            fallback "Keystore vorhanden, aber ANDROID_KEYSTORE_PASSWORD/KEYSTORE_PASSWORD fehlt"
          fi
          # Passwort + Alias prüfen, bevor Gradle mit einer kryptischen Meldung scheitert
          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" > /tmp/keytool.txt 2>&1; then
            fallback "Keystore-Passwort falsch oder Datei beschädigt ($(tail -n1 /tmp/keytool.txt))"
          fi
          ALIAS="${KEY_ALIAS:-secureguard}"
          if ! grep -qi "^${ALIAS}," /tmp/keytool.txt; then
            fallback "Key-Alias '$ALIAS' nicht im Keystore (vorhanden: $(grep -iE 'KeyEntry|CertEntry' /tmp/keytool.txt | cut -d, -f1 | tr '\n' ' '))"
          fi
          echo "SIGNING_EXPECTED=production" >> "$GITHUB_ENV"
          echo "Produktions-Keystore bereitgestellt: $KS ($(wc -c < "$KS") Bytes), Alias '$ALIAS' gefunden."

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Unit-Tests (JVM + Robolectric) – Pflicht, bricht den Debug-Leg ab.
      - name: Unit tests
        if: matrix.task == 'assembleDebug'
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee ci-logs/unit-tests.log

      # Fehlgeschlagene Tests / Compile-Fehler als GitHub-Annotations (auch ohne
      # Log-Zugriff sichtbar) – limitiert auf 10 Einträge pro Schritt.
      - name: Annotate unit test failures
        if: matrix.task == 'assembleDebug' && failure()
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          n = 0
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  for tag in ("failure", "error"):
                      el = tc.find(tag)
                      if el is not None and n < 8:
                          msg = (el.get("message") or (el.text or "").strip().splitlines()[0:1] or [""])
                          msg = msg if isinstance(msg, str) else (msg[0] if msg else "")
                          print(f"::error title=Unit-Test {tag}::{tc.get('classname')}.{tc.get('name')}: {msg[:600]}")
                          n += 1
          try:
              log = open("ci-logs/unit-tests.log", encoding="utf-8", errors="replace").read()
          except OSError:
              log = ""
          for line in log.splitlines():
              if n >= 10: break
              if re.match(r"^e: file://", line) or "Unresolved reference" in line or "Compilation error" in line or "* What went wrong" in line:
                  print("::error title=Build::" + line[:800]); n += 1
          if n == 0:
              print("::error::Unit-Tests fehlgeschlagen – Details in ci-logs/unit-tests.log (Branch ci-logs-debug) bzw. Artefakt unit-test-reports.")
          PY

      - name: Upload unit test reports
        if: matrix.task == 'assembleDebug' && always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Lint: Report als Artefakt; abortOnError=false in app/build.gradle.kts.
      - name: Android Lint
        if: matrix.task == 'assembleDebug'
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./gradlew lintDebug --no-daemon --stacktrace 2>&1 | tee ci-logs/lint.log

      - name: Upload lint report
        if: matrix.task == 'assembleDebug' && always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Build ${{ matrix.task }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEYSTORE_ALIAS || secrets.ANDROID_KEYSTORE_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./gradlew ${{ matrix.task }} --no-daemon --stacktrace 2>&1 | tee ci-logs/build.log

      - name: Annotate build failure
        if: failure()
        run: |
          grep -E "^e: file://|Unresolved reference|\* What went wrong|FAILURE: Build failed|Execution failed for task" ci-logs/build.log 2>/dev/null \
            | head -n 10 | sed 's/^/::error title=Build::/' || true

      # Jede APK (Debug UND Release) muss signiert sein; zusätzlich werden
      # minSdk/targetSdk gegen die Zielplattformen Android 11–14 geprüft.
      - name: Verify APK (signature, SDK levels)
        id: siginfo
        run: |
          set -euo pipefail
          BT=$([ "${{ matrix.task }}" = "assembleRelease" ] && echo release || echo debug)
          APK=$(find "app/build/outputs/apk/$BT" -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK" || { echo "::error::Keine APK unter app/build/outputs/apk/$BT erzeugt."; exit 1; }
          TOOLS="$ANDROID_HOME/build-tools/${{ env.BUILD_TOOLS }}"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner.txt \
            || { echo "::error::$APK ist nicht v2-signiert – nicht installierbar."; exit 1; }
          "$TOOLS/aapt2" dump badging "$APK" | grep -E "^(package|minSdkVersion|sdkVersion|targetSdkVersion|native-code):" | tee /tmp/badging.txt
          grep -qE "^(min)?[sS]dkVersion:'26'" /tmp/badging.txt || { echo "::error::minSdk != 26 ($(grep -iE 'sdkVersion' /tmp/badging.txt | tr '\n' ' '))"; exit 1; }
          grep -q "targetSdkVersion:'35'" /tmp/badging.txt || { echo "::error::targetSdk != 35"; exit 1; }
          if [ -n "${SIGNING_EXPECTED:-}" ]; then
            SHA=$(grep -m1 "SHA-256 digest" /tmp/apksigner.txt | awk '{print $NF}')
            CI_SHA="028c8f5a1c7ad122ab6b20106f52448c474091f9fe32013c7f5f721c5423edb0" # SHA-256 des CI-Debug-Zertifikats
            if [ "$SIGNING_EXPECTED" = "production" ] && [[ "$SHA" == $CI_SHA* ]]; then
              echo "::error::Produktions-Keystore erwartet, aber APK mit CI-Debug-Zertifikat signiert."; exit 1
            fi
            echo "signing_mode=$SIGNING_EXPECTED" >> "$GITHUB_OUTPUT"
          fi
          echo "✅ $APK signiert und für Android 8.0+ (Ziel: Android 11–14) gebaut."

      - name: Prepare APK artifacts
        run: |
          set -euo pipefail
          BT=$([ "${{ matrix.task }}" = "assembleRelease" ] && echo release || echo debug)
          mkdir -p apk-out
          cp app/build/outputs/apk/$BT/*.apk apk-out/
          cd apk-out
          sha256sum *.apk > SHA256SUMS.txt
          {
            echo "buildType : $BT"
            echo "commit    : ${GITHUB_SHA}"
            echo "ref       : ${GITHUB_REF_NAME}"
            echo "run       : ${GITHUB_RUN_ID}"
            echo "signing   : ${SIGNING_EXPECTED:-ci-debug-fallback}"
            echo "built (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            cat /tmp/badging.txt
          } > BUILD-INFO.txt
          ls -la

      - name: Upload APK (${{ env.ARTIFACT }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: ${{ env.RETENTION }}

      - name: Upload checksums + build info
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}-checksums
          path: |
            apk-out/SHA256SUMS.txt
            apk-out/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: ${{ env.RETENTION }}

      # Vollständige Logs + Test-/Lint-Ergebnisse als Git-Branch ci-logs-<debug|release>
      # (überlebt die Artefakt-Aufbewahrung, lesbar ohne Actions-UI: git fetch origin ci-logs-debug).
      - name: Publish CI logs (branch ci-logs-*)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          BT=$([ "${{ matrix.task }}" = "assembleRelease" ] && echo release || echo debug)
          mkdir -p ci-logs
          cp -r app/build/test-results ci-logs/test-results 2>/dev/null
          cp app/build/reports/lint-results-debug.xml ci-logs/ 2>/dev/null
          cp app/build/reports/lint-results-debug.txt ci-logs/ 2>/dev/null
          cp apk-out/BUILD-INFO.txt apk-out/SHA256SUMS.txt ci-logs/ 2>/dev/null
          cp /tmp/apksigner.txt /tmp/badging.txt ci-logs/ 2>/dev/null
          {
            echo "run      : ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "job      : ${{ matrix.task }} / status=${{ job.status }}"
            echo "commit   : ${GITHUB_SHA}"
            echo "ref      : ${GITHUB_REF_NAME}"
            echo "time UTC : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci-logs/RUN-INFO.txt
          cd ci-logs
          git init -q -b "ci-logs-$BT"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            add -A >/dev/null && \
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "CI logs: ${{ matrix.task }} run=${GITHUB_RUN_ID} sha=${GITHUB_SHA:0:7} status=${{ job.status }}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/ci-logs-$BT" \
            && echo "Logs → Branch ci-logs-$BT" || echo "::warning::CI-Logs konnten nicht gepusht werden."

  # -------------------------------------------------------------------
  # Emulator-Smoke: Android 11 (API 30) und Android 14 (API 34)
  # -------------------------------------------------------------------
  emulator-smoke:
    name: Android ${{ matrix.name }} (API ${{ matrix.api }}) smoke tests
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || github.event.inputs.run_emulator_smoke != 'false') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            name: '11'
            target: default
          - api: 34
            name: '14'
            target: google_apis
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "::warning::/dev/kvm nicht verfügbar – Software-Emulation (langsam)"
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Instrumentation tests (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-report-api${{ matrix.api }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14

  # -------------------------------------------------------------------
  # GitHub Release bei Tags v* – nur mit Produktions-Signatur
  # -------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [build, backend-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Require production signature
        env:
          MODE: ${{ needs.build.outputs.signing_mode_release }}
        run: |
          if [ "$MODE" != "production" ]; then
            echo "::error::Release-APK ist nicht mit dem Produktions-Keystore signiert (Modus: '${MODE:-unbekannt}'). Kein GitHub-Release."
            exit 1
          fi
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: secureguard-pro
          path: ./apk
      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: secureguard-pro-checksums
          path: ./apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🛡️ SecureGuard Enterprise ${{ github.ref_name }}"
          body: |
            ## 🛡️ SecureGuard Enterprise ${{ github.ref_name }}

            ### 📦 Download
            - **APK**: `release.apk` (Android 8.0+, verifiziert Android 11–14)
            - **SHA-256**: `SHA256SUMS.txt`, Build-Metadaten: `BUILD-INFO.txt`

            ### 🔑 Signatur
            - Mit Produktions-Keystore signiert (`apksigner verify` in CI erfolgreich).
            - Installation: `adb install -r release.apk` bzw. Sideload/MDM.
          files: |
            ./apk/*.apk
            ./apk/SHA256SUMS.txt
            ./apk/BUILD-INFO.txt
          draft: false
          prerelease: false
          generate_release_notes: true
