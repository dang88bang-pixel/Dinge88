name: 🛡️ Build SecureGuard APK

on:
  push:
    branches: [ main, develop, 'arena/**', 'agent/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop, 'arena/**', 'agent/**' ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Zu bauender APK-Typ'
        type: choice
        required: false
        default: 'all'
        options:
          - all
          - debug
          - release

# Nur der neueste Lauf pro Branch/Ref wird ausgeführt; überholte werden abgebrochen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  COMPILE_SDK: 'android-35'
  BUILD_TOOLS: '35.0.0'
  GRADLE_CACHE_FOLDER: ~/.gradle/caches
  GRADLE_WRAPPER_FOLDER: ~/.gradle/wrapper

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: assembleDebug
            artifact: secureguard-pro-debug
            retention: 14
          - task: assembleRelease
            artifact: secureguard-pro
            retention: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3D Operations Center bauen (bundled three.js, kein CDN) und nach
      # app/src/main/assets/console3d/ synchronisieren (§32/§33).
      - name: Build 3D console bundle
        run: |
          npm --prefix console3d install
          npm --prefix console3d run build
          bash scripts/sync-console3d.sh
          echo "=== bundle files ==="
          find app/src/main/assets/console3d -type f

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Android SDK
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          if [ ! -x "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE_VERSION=$(curl -s https://dl.google.com/android/repository/repository2-1.xml | \
              grep -oP 'commandlinetools-linux-\K[0-9]+' | sort -V | tail -1)
            if [ -z "$CMDLINE_VERSION" ]; then CMDLINE_VERSION=11076708; fi
            curl -fSL -o /tmp/cmdline.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip"
            unzip -q -o /tmp/cmdline.zip -d "$ANDROID_ROOT/cmdline-tools"
            mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          fi
          yes | "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;${{ env.COMPILE_SDK }}" "build-tools;${{ env.BUILD_TOOLS }}" "platform-tools"

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ env.COMPILE_SDK }}-${{ env.BUILD_TOOLS }}

      # Release-Keystore aus Secret dekodieren (nur für Release-Builds).
      - name: Decode release keystore
        if: matrix.task == 'assembleRelease'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > secureguard-keystore.jks
            echo "Keystore written (size: $(wc -c < secureguard-keystore.jks) bytes)."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 fehlt – Release wird unsigniert gebaut."
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Unit-Tests (JVM/Robolectric) – bricht das CI vor dem Release ab.
      - name: Unit tests
        if: matrix.task == 'assembleDebug'
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Android Lint
        if: matrix.task == 'assembleDebug'
        run: ./gradlew lintDebug --no-daemon --stacktrace || echo "::warning::lintDebug hatte Befunde (kein Hard-Fail)"

      - name: Build ${{ matrix.task }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew ${{ matrix.task }} --no-daemon --stacktrace

      - name: Verify release APK is signed
        if: matrix.task == 'assembleRelease'
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          if "$ANDROID_HOME/build-tools/${{ env.BUILD_TOOLS }}/apksigner" verify "$APK"; then
            echo "✅ release.apk ist signiert."
          else
            echo "⚠️ release.apk ist UNSIGNIERT (Signing-Secrets fehlen?)."
          fi

      - name: Prepare APK artifacts
        run: |
          mkdir -p apk-out
          if [ "${{ matrix.task }}" = "assembleRelease" ]; then
            cp app/build/outputs/apk/release/*.apk apk-out/ 2>/dev/null || true
          else
            cp app/build/outputs/apk/debug/*.apk apk-out/ 2>/dev/null || true
          fi
          cd apk-out
          sha256sum *.apk > SHA256SUMS.txt
          ls -la

      - name: Upload APK (${{ matrix.artifact }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: ${{ matrix.retention }}

      - name: Upload SHA256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-checksums
          path: apk-out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: ${{ matrix.retention }}

      - name: Upload unit test reports
        if: matrix.task == 'assembleDebug' && always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  android-11-smoke:
    name: Android 11 / API 30 smoke tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build 3D console bundle
        run: |
          npm --prefix console3d install
          npm --prefix console3d run build
          bash scripts/sync-console3d.sh
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Android 11 instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

  slack-mcp-image:
    name: Slack-MCP image + MCP handshake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compose config validieren
        run: docker compose config --quiet
      - name: Image bauen (slack-mcp)
        run: docker compose build slack-mcp
      - name: Server starten (Demo-Modus)
        run: docker compose up -d slack-mcp
      - name: MCP-Handshake (initialize)
        run: |
          req='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}'
          for i in $(seq 1 30); do
            if curl -fsS -o /tmp/init.json -X POST \
                 -H 'Content-Type: application/json' \
                 -H 'Accept: application/json, text/event-stream' \
                 -d "$req" http://127.0.0.1:13080/mcp; then
              echo "initialize beantwortet:"; cat /tmp/init.json; exit 0
            fi
            sleep 2
          done
          echo "MCP-Handshake fehlgeschlagen – Logs:"
          docker compose logs --tail=60 slack-mcp
          exit 1
      - name: Container stoppen
        if: always()
        run: docker compose down -v

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest backend/tests -v

  release:
    runs-on: ubuntu-latest
    needs: [build, backend-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: secureguard-pro
          path: ./apk
      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: secureguard-pro-checksums
          path: ./apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🛡️ SecureGuard Pro ${{ github.ref_name }}"
          body: |
            ## 🛡️ SecureGuard Enterprise

            ### ✅ Funktionen
            - 🖥️ 22 Screens + 3D Operations Center (Three.js, lokal gebundelt)
            - 🧠 Selbstlernender Agent
            - 🗺️ OpenStreetMap-Karte
            - 🎮 Actions Center (Acht Geräteaktionen + 3D-Szenenaktionen)
            - 🔒 DSGVO-konform, SQLCipher-at-rest

            ### 📦 Download
            - **APK**: `release.apk`
            - **SHA-256**: `SHA256SUMS.txt`

            ### 🔑 Signatur
            - Release wird nur signiert, wenn die `ANDROID_KEYSTORE_*`-Secrets gesetzt sind.
          files: |
            ./apk/*.apk
            ./apk/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
