name: Build SecureGuard APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Zu bauender APK-Typ'
        type: choice
        required: false
        default: 'all'
        options:
          - all
          - debug
          - release

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: APK (JDK 17 + Android SDK)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-read-only: false

      - name: Decode Release-Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/secureguard-keystore.jks
            echo "Keystore geschrieben ($(wc -c < app/secureguard-keystore.jks) Bytes)."
          else
            echo "::notice::Kein KEYSTORE_BASE64 – Release wird mit Debug-Key signiert (installierbar)."
          fi

      - name: Build Debug + Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          gradle assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Prepare APK artifacts
        run: |
          mkdir -p apk-out
          find app/build/outputs/apk -name '*.apk' -print -exec cp {} apk-out/ \;
          cd apk-out
          if ls *.apk >/dev/null 2>&1; then
            for f in *.apk; do
              case "$f" in
                *debug*) mv "$f" SecureGuard-Enterprise-1.1.0-debug.apk ;;
                *release*) mv "$f" SecureGuard-Enterprise-1.1.0-android11.apk ;;
              esac
            done
            sha256sum *.apk > SHA256SUMS.txt
            ls -la
          else
            echo "Keine APK gefunden" >&2
            find ../app/build/outputs -type f || true
            exit 1
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: secureguard-apk
          path: |
            apk-out/*.apk
            apk-out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: secureguard-apk
          path: ./apk

      - name: Publish / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.1.0"
          TITLE="SecureGuard Enterprise 1.1.0 (Android 11)"
          NOTES=$(cat <<'EOF'
          ## SecureGuard Enterprise 1.1.0

          Installierbare APK für **Android 11 (API 30)** und höher (minSdk 26).
          Gebaut mit **JDK 17** + **Android SDK 34** + **Gradle 8.5**.

          ### Alle Funktionen aktiv
          - BLE-Scan & GATT-Fernsteuerung (Alarm, Licht, Motor, Batterie, Nachricht, Position, Restart, Telemetrie)
          - WiFi-BSSID-Erkennung
          - GPS / Satellit
          - LoRa / Optik / Urban / Crowd über konfigurierbare Endpunkte
          - Selbstlernender Agent + WorkManager
          - OpenStreetMap, QR-Scan, Alarme, Dashboard

          ### Installation
          1. `SecureGuard-Enterprise-1.1.0-android11.apk` herunterladen
          2. Unbekannte Quellen erlauben und installieren
          3. Standort + Bluetooth (+ Kamera für QR) erteilen
          4. Agent starten

          Debug-Variante: `SecureGuard-Enterprise-1.1.0-debug.apk`
          EOF
          )
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" ./apk/*.apk ./apk/SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" ./apk/*.apk ./apk/SHA256SUMS.txt \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
