name: 🛡️ Build SecureGuard APK

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Zu bauender APK-Typ'
        type: choice
        required: false
        default: 'all'
        options:
          - all
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  COMPILE_SDK: 'android-35'
  BUILD_TOOLS: '35.0.0'
  GRADLE_CACHE_FOLDER: ~/.gradle/caches
  GRADLE_WRAPPER_FOLDER: ~/.gradle/wrapper

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: assembleDebug
            artifact: secureguard-pro-debug
            retention: 14
          - task: assembleRelease
            artifact: secureguard-pro
            retention: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Android SDK
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          if [ ! -x "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE_VERSION=$(curl -s https://dl.google.com/android/repository/repository2-1.xml | \
              grep -oP 'commandlinetools-linux-\K[0-9]+' | sort -V | tail -1)
            if [ -z "$CMDLINE_VERSION" ]; then CMDLINE_VERSION=11076708; fi
            curl -fSL -o /tmp/cmdline.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip"
            unzip -q -o /tmp/cmdline.zip -d "$ANDROID_ROOT/cmdline-tools"
            mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          fi
          yes | "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;${{ env.COMPILE_SDK }}" "build-tools;${{ env.BUILD_TOOLS }}" "platform-tools"

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ env.COMPILE_SDK }}-${{ env.BUILD_TOOLS }}

      # IMPORTANT: app/build.gradle.kts expects the keystore at the project root.
      - name: Decode release keystore
        if: matrix.task == 'assembleRelease'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 fehlt. Ein Release darf nicht unsigniert ausgeliefert werden."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > secureguard-keystore.jks
          test -s secureguard-keystore.jks
          echo "Release keystore bereitgestellt."

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        if: matrix.task == 'assembleDebug'
        run: ./gradlew test --no-daemon --stacktrace

      - name: Lint
        if: matrix.task == 'assembleDebug'
        run: ./gradlew lint --no-daemon --stacktrace

      - name: Build ${{ matrix.task }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew ${{ matrix.task }} --no-daemon --stacktrace

      - name: Verify release APK is signed
        if: matrix.task == 'assembleRelease'
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/${{ env.BUILD_TOOLS }}/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/${{ env.BUILD_TOOLS }}/apksigner" verify --print-certs "$APK"
          echo "Verified signed release APK: $APK"

      - name: Prepare APK artifacts
        run: |
          mkdir -p apk-out
          if [ "${{ matrix.task }}" = "assembleRelease" ]; then
            cp app/build/outputs/apk/release/*.apk apk-out/
          else
            cp app/build/outputs/apk/debug/*.apk apk-out/
          fi
          cd apk-out
          sha256sum *.apk > SHA256SUMS.txt
          ls -la

      - name: Upload APK (${{ matrix.artifact }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: ${{ matrix.retention }}

      - name: Upload SHA256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-checksums
          path: apk-out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: ${{ matrix.retention }}

  android-11-smoke:
    name: Android 11 / API 30 smoke tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Android 11 instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: secureguard-pro
          path: ./apk

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: secureguard-pro-checksums
          path: ./apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🛡️ SecureGuard Pro ${{ github.ref_name }}"
          body: |
            ## 🛡️ SecureGuard Enterprise

            ### 📦 Download
            - **APK**: `release.apk`
            - **SHA-256**: `SHA256SUMS.txt`

            ### 🔑 Signatur
            - Release wird nur veröffentlicht, wenn `KEYSTORE_*`-Secrets vorhanden sind.
            - Der CI-Schritt `apksigner verify` muss erfolgreich sein.
          files: |
            ./apk/*.apk
            ./apk/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
