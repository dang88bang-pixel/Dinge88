; SecureGuard Enterprise – ESP32 Gateway (PlatformIO)
; ----------------------------------------------------
; Online-Build (Standard):
;   cd firmware/secureguard_esp32 && pio run
;
; Offline-Build:
;   1) Auf Online-PC:  ./scripts/offline/download-platformio.sh
;   2) offline_repo/ übertragen
;   3) Auf Offline-PC: ./scripts/offline/install-platformio.sh
;      → schreibt file://-Pfade in diese Datei (Backup: platformio.ini.bak)
;
; Arduino-IDE: secureguard_esp32.ino weiterhin nutzbar (gleiche Libs).

[platformio]
default_envs = esp32dev
; Sketch liegt direkt in diesem Ordner (Arduino-kompatibel)
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DSECUREGUARD_FIRMWARE=1

; .ino wird von PlatformIO als C++-Sketch erkannt
build_src_filter =
    +<*>

lib_deps =
    knolleary/PubSubClient@^2.8
    sandeepmistry/LoRa@^0.8.0
    bblanchon/ArduinoJson@^7.0.0

; Optional: zusätzliche lokale Bibliotheken
; lib_extra_dirs = ../../offline_repo/platformio/libs

board_build.partitions = default.csv

; --- Offline-Beispiel (von install-platformio.sh generiert) ---------------
; platform = file:///home/user/offline_repo/platformio/platforms/espressif32-*.tar.gz
; lib_deps =
;     file:///home/user/offline_repo/platformio/libs/PubSubClient-*.tar.gz
;     file:///home/user/offline_repo/platformio/libs/LoRa-*.tar.gz
;     file:///home/user/offline_repo/platformio/libs/ArduinoJson-*.tar.gz
