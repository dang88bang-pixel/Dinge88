; SecureGuard Enterprise – ESP32 Gateway Firmware
; ------------------------------------------------
; Echte Firmware für ESP32 mit LoRa SX1278 (868 MHz), BLE, WiFi/MQTT.
; Keine Simulation: ADC-Batterie, WiFi-RSSI, LoRa-RSSI sind echte Sensordaten.
;
; Build/Flash:
;   pio run                 # kompilieren
;   pio run -t upload       # flashen
;   pio device monitor      # Konsole (115200)
;
; Voraussetzung: Python >= 3.9 + pip install platformio

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    sandeepmistry/LoRa @ ^0.9.0
    knolleary/PubSubClient @ ^2.8

build_flags =
    -D CORE_DEBUG_LEVEL=2
