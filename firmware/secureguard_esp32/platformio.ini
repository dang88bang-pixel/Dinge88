; SecureGuard Enterprise – ESP32 Gateway (Arduino)
;
; Build (ohne Flash):
;   pio run
; Upload:
;   pio run --target upload
;
; Benötigte Abhängigkeiten werden automatisch durch PlatformIO aufgelöst.
; Hardware: LoRa-Modul SS=5, RST=14, DIO0=2; Batterie-ADC GPIO34; Motor GPIO4.

[platformio]
default_envs = esp32dev
src_dir = .
build_dir = .pio/build

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi ; Standard-4MB-Flash (falls abweichend anpassen)

lib_deps =
    knolleary/PubSubClient@^2.8
    sandeepmistry/arduino-LoRa@^0.8.0

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
