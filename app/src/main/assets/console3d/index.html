<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>SecureGuard Ops Center</title>
    <style>
      :root {
        --bg: #060d18;
        --navy: #0a2540;
        --surface: #12233a;
        --border: #1d3a5c;
        --cyan: #00d4ff;
        --green: #00e676;
        --amber: #ffc400;
        --red: #ff1744;
        --text: #e0e6ed;
        --muted: #8899aa;
        --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas.three { display: block; }
      /* CSS2D renderer places labels in this fixed layer */
      #labels { position: absolute; top: 0; left: 0; width: 0; height: 0; overflow: visible; pointer-events: none; }
      .css-label {
        color: #cfe7ff; font-size: 11px; font-family: var(--mono); white-space: nowrap;
        text-shadow: 0 0 6px rgba(0,212,255,.8); pointer-events: auto;
        background: rgba(6,13,24,.55); border: 1px solid rgba(0,212,255,.25);
        padding: 2px 6px; border-radius: 4px; transform: translate(-50%, -50%);
      }
      .css-label.alarm { border-color: rgba(255,23,68,.6); color: #ffb3c1; text-shadow: 0 0 6px rgba(255,23,68,.8); }
      /* HUD panels */
      .hud { position: absolute; z-index: 10; }
      .panel {
        background: linear-gradient(180deg, rgba(10,37,64,.92), rgba(6,13,24,.94));
        border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 0 22px rgba(0,0,0,.5);
        backdrop-filter: blur(3px);
      }
      #topbar { top: 0; left: 0; right: 0; display: flex; gap: 8px; padding: 8px 10px; align-items: stretch; flex-wrap: wrap; }
      .metric { min-width: 74px; padding: 6px 10px; text-align: left; }
      .metric .k { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
      .metric .v { font-size: 18px; font-weight: 700; font-family: var(--mono); }
      .metric .sub { font-size: 9px; color: var(--muted); font-family: var(--mono); }
      .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-family: var(--mono); padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border); }
      .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
      .badge.ok .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
      .badge.warn .dot { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
      .badge.err .dot { background: var(--red); box-shadow: 0 0 6px var(--red); }
      .badge.source-sim { border-color: var(--amber); color: var(--amber); }
      #assetpanel { top: 116px; left: 10px; width: 250px; max-height: calc(100% - 220px); display: flex; flex-direction: column; }
      #assetpanel .head { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
      #assetsearch { flex: 1; background: #0a1628; border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 12px; }
      #assetlist { overflow-y: auto; padding: 6px; }
      .asset-item {
        display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 7px; cursor: pointer;
        border: 1px solid transparent; font-size: 12px;
      }
      .asset-item:hover { background: rgba(0,212,255,.08); }
      .asset-item.selected { background: rgba(0,212,255,.14); border-color: rgba(0,212,255,.4); }
      .asset-item .led { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
      .asset-item .nm { flex: 1; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .asset-item .rssi { color: var(--muted); font-family: var(--mono); font-size: 10px; }
      #actiondock { right: 10px; top: 116px; width: 210px; display: flex; flex-direction: column; gap: 6px; }
      #actiondock .btn { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 9px 11px; cursor: pointer; font-family: var(--mono); font-size: 11px; }
      #actiondock .btn:hover { border-color: var(--cyan); }
      #actiondock .risk { font-size: 9px; padding: 1px 6px; border-radius: 999px; border: 1px solid; }
      .risk.low { color: var(--green); border-color: var(--green); }
      .risk.med { color: var(--amber); border-color: var(--amber); }
      .risk.high { color: #ff9100; border-color: #ff9100; }
      .risk.crit { color: var(--red); border-color: var(--red); }
      #eventfeed { left: 10px; top: 116px; width: 250px; max-height: 220px; overflow-y: auto; padding: 8px; }
      #eventfeed .ev { font-family: var(--mono); font-size: 10px; padding: 3px 0; border-bottom: 1px solid rgba(29,58,92,.5); color: var(--muted); }
      #eventfeed .ev .t { color: #5c748f; margin-right: 6px; }
      #eventfeed.hidden, #assetpanel.hidden { display: none; }
      #bottombar { bottom: 10px; left: 10px; right: 10px; display: flex; gap: 8px; align-items: center; padding: 8px 10px; }
      #bottombar .src { font-family: var(--mono); font-size: 10px; color: var(--muted); flex: 1; }
      .drawer { position: absolute; bottom: 58px; left: 10px; right: 10px; max-height: 40%; overflow-y: auto; padding: 10px; display: none; }
      .drawer.open { display: block; }
      .drawer .row { font-family: var(--mono); font-size: 11px; padding: 3px 0; border-bottom: 1px solid rgba(29,58,92,.35); }
      .drawer h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan); margin-bottom: 6px; }
      .palette { position: absolute; top: 8%; left: 12%; width: 76%; display: none; z-index: 30; }
      .palette.open { display: block; }
      .palette input { width: 100%; padding: 12px 14px; background: #0a1628; color: var(--text); border: 1px solid var(--cyan); border-radius: 8px; font-size: 15px; }
      .palette .results { margin-top: 6px; }
      .palette .cmd { padding: 8px 10px; cursor: pointer; font-family: var(--mono); font-size: 12px; border-radius: 6px; }
      .palette .cmd:hover, .palette .cmd.active { background: rgba(0,212,255,.12); }
      .dialog { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); z-index: 40; }
      .dialog.open { display: flex; }
      .dialog .box { width: min(360px, 88%); padding: 18px; }
      .dialog .box p { font-size: 13px; margin: 10px 0; color: var(--muted); }
      .dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
      .btn { background: #0a1c30; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; cursor: pointer; font-size: 12px; }
      .btn:hover { border-color: var(--cyan); }
      .btn.primary { background: var(--cyan); color: #032636; border-color: var(--cyan); font-weight: 700; }
      .btn.danger { background: #3a0a16; color: var(--red); border-color: var(--red); }
      #toasts { position: absolute; right: 12px; top: 96px; display: flex; flex-direction: column; gap: 6px; z-index: 50; }
      .toast {
        padding: 9px 12px; border-radius: 8px; font-size: 12px; font-family: var(--mono);
        background: rgba(10,37,64,.96); border: 1px solid var(--cyan); box-shadow: 0 0 14px rgba(0,0,0,.5);
        animation: fade .25s ease-out;
      }
      .toast.err { border-color: var(--red); color: #ffb3c1; }
      @keyframes fade { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
      @media (max-width: 640px) {
        #assetpanel { width: 44%; max-height: 34%; }
        #actiondock { width: 178px; }
        .metric { min-width: 60px; }
        .metric .v { font-size: 15px; }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-BZRf026L.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="labels"></div>
    <!-- HUD -->
    <div id="topbar" class="hud panel"></div>
    <div id="eventfeed" class="hud panel"></div>
    <div id="assetpanel" class="hud panel">
      <div class="head">
        <span style="font-family:var(--mono);font-size:10px;color:var(--muted);">ASSETS</span>
        <input id="assetsearch" type="search" placeholder="Search…" autocomplete="off" />
      </div>
      <div id="assetlist"></div>
    </div>
    <div id="actiondock" class="hud panel"></div>
    <div id="bottombar" class="hud panel">
      <span id="srcindicator" class="src">SOURCE: …</span>
      <button class="btn" id="btn-log" type="button">LOG</button>
      <button class="btn" id="btn-alarms" type="button">ALARMS</button>
      <button class="btn" id="btn-cmd" type="button">⌘K</button>
    </div>
    <div id="logdrawer" class="hud panel drawer"></div>
    <div id="alarmdrawer" class="hud panel drawer"></div>
    <!-- Command palette -->
    <div id="palette" class="palette panel">
      <input id="paletteInput" type="text" placeholder="Type a command…" autocomplete="off" />
      <div class="results" id="paletteResults"></div>
    </div>
    <!-- Confirm dialog -->
    <div id="dialog" class="dialog">
      <div class="box panel">
        <h3 id="dialogTitle" style="font-family:var(--mono);color:var(--red);">Confirm</h3>
        <p id="dialogText"></p>
        <div class="row">
          <button class="btn" id="dialogCancel" type="button">Cancel</button>
          <button class="btn danger" id="dialogOk" type="button">Execute</button>
        </div>
      </div>
    </div>
    <div id="toasts" class="hud"></div>
  </body>
</html>
