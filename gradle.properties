# Project-wide Gradle settings.
# 3 GB heap: passt auf GitHub-hosted Runner (7 GB), vermeidet OOM bei
# parallelem Kapt/Compose. Kotlin-Compiler läuft im Daemon, nicht in-process.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35

# Kotlin code style
kotlin.code.style=official
