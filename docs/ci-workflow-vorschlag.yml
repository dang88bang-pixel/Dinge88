name: 🛡️ Build SecureGuard APK

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Zu bauender APK-Typ'
        type: choice
        required: false
        default: 'all'
        options:
          - all
          - debug
          - release

# Nur der neueste Lauf pro Branch/Ref wird ausgeführt; überholte werden abgebrochen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  COMPILE_SDK: 'android-35'
  BUILD_TOOLS: '35.0.0'
  GRADLE_CACHE_FOLDER: ~/.gradle/caches
  GRADLE_WRAPPER_FOLDER: ~/.gradle/wrapper

jobs:
  # ============ QUALITÄTSSICHERUNG: TESTS + LINT ============
  # Läuft VOR dem APK-Build – schlägt der Test/Lint fehl, wird keine APK gebaut.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Android SDK
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          if [ ! -x "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE_VERSION=$(curl -s https://dl.google.com/android/repository/repository2-1.xml | \
              grep -oP 'commandlinetools-linux-\K[0-9]+' | sort -V | tail -1)
            if [ -z "$CMDLINE_VERSION" ]; then CMDLINE_VERSION=11076708; fi
            curl -fSL -o /tmp/cmdline.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip"
            unzip -q -o /tmp/cmdline.zip -d "$ANDROID_ROOT/cmdline-tools"
            mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          fi
          yes | "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;${{ env.COMPILE_SDK }}" "build-tools;${{ env.BUILD_TOOLS }}" "platform-tools"

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ env.COMPILE_SDK }}-${{ env.BUILD_TOOLS }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Unit-Tests + Lint (BuildConfig-Felder können über Secrets gesetzt werden,
      # sind für Tests/Lint aber optional – leere Werte sind erlaubt).
      - name: Run unit tests & lint
        env:
          ORG_GRADLE_PROJECT_WIGLE_API_KEY: ${{ secrets.WIGLE_API_KEY }}
          ORG_GRADLE_PROJECT_OPEN_CHARGE_MAP_KEY: ${{ secrets.OPEN_CHARGE_MAP_KEY }}
          ORG_GRADLE_PROJECT_NETATMO_TOKEN: ${{ secrets.NETATMO_TOKEN }}
          ORG_GRADLE_PROJECT_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ORG_GRADLE_PROJECT_MQTT_BROKER_URL: ${{ secrets.MQTT_BROKER_URL }}
          ORG_GRADLE_PROJECT_WEBSOCKET_URL: ${{ secrets.WEBSOCKET_URL }}
          ORG_GRADLE_PROJECT_MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: assembleDebug
            artifact: secureguard-pro-debug
            retention: 14
          - task: assembleRelease
            artifact: secureguard-pro
            retention: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # Gradle Wrapper validieren + Dependency-/Wrapper-Cache (großer Speedup).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Install the Android SDK cmdline-tools + required packages (einmalig,
      # danach über actions/cache wiederverwendet).
      - name: Install Android SDK
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          if [ ! -x "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE_VERSION=$(curl -s https://dl.google.com/android/repository/repository2-1.xml | \
              grep -oP 'commandlinetools-linux-\K[0-9]+' | sort -V | tail -1)
            if [ -z "$CMDLINE_VERSION" ]; then CMDLINE_VERSION=11076708; fi
            curl -fSL -o /tmp/cmdline.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip"
            unzip -q -o /tmp/cmdline.zip -d "$ANDROID_ROOT/cmdline-tools"
            mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          fi
          yes | "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;${{ env.COMPILE_SDK }}" "build-tools;${{ env.BUILD_TOOLS }}" "platform-tools"

      # Android-SDK-Komponenten zwischen Läufen cachen (erspart Download/Unzip).
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ env.COMPILE_SDK }}-${{ env.BUILD_TOOLS }}

      # Release-Keystore aus Secret dekodieren (nur für Release-Builds).
      - name: Decode Keystore
        if: matrix.task == 'assembleRelease'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/secureguard-keystore.jks
            echo "Keystore written (size: $(wc -c < app/secureguard-keystore.jks) bytes)."
          else
            echo "::warning::KEYSTORE_BASE64 is not set - APK wird UNSIGNIERT gebaut."
          fi

      # Signing-Konfiguration nur dann anwenden, wenn der Keystore existiert.
      - name: Prepare signing config
        if: matrix.task == 'assembleRelease'
        run: |
          if [ -f "app/secureguard-keystore.jks" ]; then
            echo "SG_HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "SG_HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build ${{ matrix.task }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # API-Keys aus Repo-Secrets → Gradle-Properties (ORG_GRADLE_PROJECT_*
          # wird von Gradle automatisch als Project-Property exponiert und von
          # app/build.gradle.kts apiKey() gelesen). Ohne Secret: leerer Key,
          # die zugehörigen API-Kanäle liefern dann null/leer (by design).
          ORG_GRADLE_PROJECT_WIGLE_API_KEY: ${{ secrets.WIGLE_API_KEY }}
          ORG_GRADLE_PROJECT_OPEN_CHARGE_MAP_KEY: ${{ secrets.OPEN_CHARGE_MAP_KEY }}
          ORG_GRADLE_PROJECT_NETATMO_TOKEN: ${{ secrets.NETATMO_TOKEN }}
          ORG_GRADLE_PROJECT_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ORG_GRADLE_PROJECT_MQTT_BROKER_URL: ${{ secrets.MQTT_BROKER_URL }}
          ORG_GRADLE_PROJECT_WEBSOCKET_URL: ${{ secrets.WEBSOCKET_URL }}
          ORG_GRADLE_PROJECT_MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
        run: ./gradlew ${{ matrix.task }} --no-daemon --stacktrace

      # APK benennen + Prüfsumme berechnen.
      - name: Prepare APK artifacts
        run: |
          mkdir -p apk-out
          cp app/build/outputs/apk/release/*.apk apk-out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk apk-out/ 2>/dev/null || true
          cd apk-out
          sha256sum *.apk > SHA256SUMS.txt
          ls -la

      - name: Upload APK (${{ matrix.artifact }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: ${{ matrix.retention }}

      - name: Upload SHA256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-checksums
          path: apk-out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: ${{ matrix.retention }}

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: secureguard-pro
          path: ./apk

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: secureguard-pro-checksums
          path: ./apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🛡️ SecureGuard Pro ${{ github.ref_name }}"
          body: |
            ## 🛡️ SecureGuard Enterprise

            ### ✅ Funktionen
            - 📡 LoRa/LoRaWAN
            - 🧠 Selbstlernender Agent
            - 🗺️ OpenStreetMap-Karte
            - 🎮 Fernsteuerung (Alarm, Motor, Batterie)
            - 👁️ Optische Erkennung
            - 🌍 Apple/Google Crowdsourcing (nur mit Einwilligung)
            - 🏙️ Urbane Infrastruktur
            - 📡 GPS/GLONASS/Galileo
            - 🔒 DSGVO-konform

            ### 📦 Download
            - **APK**: `secureguard-pro.apk`

            ### 🔑 Signatur
            - APK **signiert**, wenn die Keystore-Secrets gesetzt sind.
            - Sonst wird eine **unsignierte** APK erzeugt (`app-release-unsigned.apk`).

            > 🔐 Prüfsummen siehe `SHA256SUMS.txt` im Release.
          files: |
            ./apk/*.apk
            ./apk/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
