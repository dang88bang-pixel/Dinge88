openapi: 3.0.0
info:
  title: SecureGuard Enterprise API
  description: REST + WebSocket API des SecureGuard-Backends (FastAPI).
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Lokale Entwicklung

paths:
  /api/health:
    get:
      summary: Gesundheitsstatus
      responses:
        '200':
          description: Status OK
          content:
            application/json:
              example:
                status: ok
                timestamp: '2026-08-20T10:00:00'

  /api/assets:
    get:
      summary: Alle Assets abrufen
      responses:
        '200':
          description: Liste der Assets
    post:
      summary: Neues Asset anlegen/aktualisieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Asset'
      responses:
        '200':
          description: Asset gespeichert

  /api/detections:
    get:
      summary: Detektionen auflisten
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Liste der Detektionen
    post:
      summary: Neue Detektion hinzufügen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Detection'
      responses:
        '200':
          description: Detektion gespeichert

  /api/alerts:
    get:
      summary: Alerts auflisten
      parameters:
        - name: unresolved_only
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Liste der Alerts
    post:
      summary: Neuen Alert anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Alert'
      responses:
        '200':
          description: Alert gespeichert

  /api/actions/execute:
    post:
      summary: Aktion ausführen (wird asynchron über MQTT zugestellt)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Action'
      responses:
        '200':
          description: Aktion in Queue

  /api/commands:
    get:
      summary: Befehls-Historie
      responses:
        '200':
          description: Liste der Befehle

  /api/stats:
    get:
      summary: Statistiken (Assets, Detektionen, Alerts)
      responses:
        '200':
          description: Zähler

  /api/crowd/report:
    post:
      summary: Anonyme Crowd-Sichtung melden
      tags: [Crowd]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrowdSighting'
      responses:
        '200':
          description: Sichtung gespeichert

  /api/crowd/search:
    get:
      summary: Crowd-Sichtungen für eine MAC abrufen
      tags: [Crowd]
      parameters:
        - name: mac
          in: query
          required: true
          schema:
            type: string
            example: 'AA:BB:CC:DD:EE:01'
        - name: hours
          in: query
          schema:
            type: integer
            default: 24
      responses:
        '200':
          description: Liste der Sichtungen

  /api/slack/health:
    get:
      summary: Slack-MCP-Status
      description: Konfiguration, Erreichbarkeit des MCP-Servers, Tool-Anzahl.
      tags: [Slack]
      parameters:
        - name: probe
          in: query
          description: 'true = MCP-Server live abfragen (initialize + tools/list)'
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Status
          content:
            application/json:
              example:
                configured: true
                reachable: true
                transport: http
                url: 'http://slack-mcp:13080/mcp'
                tools: 12
                notify:
                  enabled: true
                  channel: '#secureguard-alerts'
                  min_severity: WARNING

  /api/slack/tools:
    get:
      summary: Registrierte MCP-Tools
      tags: [Slack]
      parameters:
        - name: refresh
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Tool-Liste
        '502':
          description: Slack-MCP-Server nicht erreichbar

  /api/slack/channels:
    get:
      summary: Channel-Verzeichnis (MCP-Tool channels_list)
      tags: [Slack]
      parameters:
        - name: channel_types
          in: query
          schema:
            type: string
            default: public_channel,private_channel
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
      responses:
        '200':
          description: Channels als JSON (aus CSV des Tools)
        '502':
          description: Tool-Aufruf fehlgeschlagen

  /api/slack/call:
    post:
      summary: Beliebigen MCP-Tool-Aufruf ausführen
      description: Erfordert X-API-Key, sobald SECUREGUARD_API_KEY gesetzt ist.
      tags: [Slack]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlackCall'
      responses:
        '200':
          description: Tool-Ergebnis (ok, text, is_error)
        '401':
          description: X-API-Key fehlt oder ist falsch
        '502':
          description: MCP-Fehler

  /api/slack/notify:
    post:
      summary: Meldung in einen Slack-Channel senden
      description: |
        Manueller Versand (ohne Severity-Gate). Mit `asset_id` wird die Meldung
        wie ein Alert formatiert. Automatische Alarme laufen über
        POST /api/alerts bzw. MQTT `secureguard/+/alert`.
      tags: [Slack]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlackNotify'
      responses:
        '200':
          description: Gesendet (transport mcp|webhook)
        '401':
          description: X-API-Key fehlt oder ist falsch
        '502':
          description: Nicht gesendet (MCP-Server/Webhook)

  /ws:
    get:
      summary: WebSocket-Endpunkt für Echtzeit-Updates
      description: |
        Nachrichten vom Typ {"type":"command","assetId":"...","action":"..."}.
        Der Server forwarded auch MQTT-Telemetrie/Alerts an alle verbundenen Clients.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    SlackCall:
      type: object
      required: [tool]
      properties:
        tool:
          type: string
          example: conversations_history
        arguments:
          type: object
          additionalProperties: true
          example: { channel_id: '#general', limit: '10' }
    SlackNotify:
      type: object
      required: [message]
      properties:
        message: { type: string }
        channel: { type: string, example: '#secureguard-alerts' }
        asset_id: { type: string, example: 'AA:BB:CC:DD:EE:01' }
        alert_type: { type: string, default: STATUS }
        severity: { type: string, enum: [INFO, WARNING, CRITICAL], default: INFO }
    Asset:
      type: object
      required: [id, name, mac, short_name]
      properties:
        id: { type: string }
        name: { type: string }
        mac: { type: string, example: 'AA:BB:CC:DD:EE:01' }
        short_name: { type: string }
        status: { type: string, enum: [ONLINE, OFFLINE, MAINTENANCE, SEARCHING, UNKNOWN] }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        rssi: { type: integer }
        last_seen: { type: string, format: date-time }
    Detection:
      type: object
      required: [asset_mac, source_type]
      properties:
        asset_mac: { type: string }
        source_type:
          type: string
          enum: [BLE, WIFI, LORA, TELEMETRY, OPTICAL, URBAN, CROWD, SATELLITE, API, MQTT, WEBSOCKET, NFC, UNKNOWN]
        node_id: { type: string }
        rssi: { type: integer }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        timestamp: { type: string, format: date-time }
    Alert:
      type: object
      required: [asset_id, message]
      properties:
        asset_id: { type: string }
        type: { type: string, enum: [SECURITY, CRITICAL, WARNING, INFO, GEOFENCE, LOW_BATTERY, MAINTENANCE] }
        severity: { type: string, enum: [INFO, WARNING, CRITICAL] }
        message: { type: string }
        timestamp: { type: string, format: date-time }
    Action:
      type: object
      required: [asset_id, action_type]
      properties:
        asset_id: { type: string }
        action_type:
          type: string
          enum: [ALARM, LIGHT, MOTOR_OFF, BATTERY, MESSAGE, POSITION, RESTART, TELEMETRY]
        parameters:
          type: object
          additionalProperties: true
    CrowdSighting:
      type: object
      required: [mac]
      properties:
        mac: { type: string, example: 'AA:BB:CC:DD:EE:01' }
        reporter_id: { type: string, example: 'device-123' }
        rssi: { type: integer, example: -65 }
        latitude: { type: number, format: double, example: 52.52 }
        longitude: { type: number, format: double, example: 13.40 }
