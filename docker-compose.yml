# SecureGuard Enterprise – Backend-Stack
#   ./scripts/start-stack.sh
#   docker compose up --build -d
#
# Enthält: MQTT-Broker (Mosquitto), FastAPI-Backend, Node-RED-Flows.
# Passwörter/MQTT-Auth: Anwender setzt selbst (siehe mosquitto/config/*.example).
# Optionale Umgebungsvariablen (werden aus .env gelesen, siehe .env.example):
#   SECUREGUARD_API_KEY – schützt alle schreibenden Backend-Endpunkte (X-API-Key)
#   CORS_ORIGINS        – kommaseparierte erlaubte Origins (Default: *)

services:
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: secureguard-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - secureguard-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Port-Check statt Auth-Bindung: funktioniert auch, wenn später
      # allow_anonymous=false gesetzt wird (mosquitto_sub würde sonst immer
      # scheitern, solange kein Healthcheck-User in der passwd-Datei steht).
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 2>/dev/null || mosquitto_sub -h 127.0.0.1 -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build: ./backend
    container_name: secureguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/data/secureguard.db
      - MQTT_BROKER=mqtt:1883
      # Optional (aus .env): MQTT-Broker-Auth (Produktion: allow_anonymous=false)
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      # Optional (aus .env): schreibende Endpunkte per X-API-Key schützen
      - SECUREGUARD_API_KEY=${SECUREGUARD_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - ./data:/data
    depends_on:
      - mqtt
    networks:
      - secureguard-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Kein --reload im Stack (Dev-Flag); CMD kommt aus dem Dockerfile.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3); exit(0 if r.status==200 else 1)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  nodered:
    image: nodered/node-red:latest
    container_name: secureguard-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Berlin
      # Flow-Credentials-Verschlüsselung (settings.js liest sie) – in .env setzen!
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET:-secureguard-change-me}
    volumes:
      - ./nodered:/data
    depends_on:
      - mqtt
      - backend
    networks:
      - secureguard-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1880/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  secureguard-network:
    driver: bridge
