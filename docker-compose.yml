# SecureGuard Enterprise – Backend-Stack
#   docker compose up --build
#
# Enthält: MQTT-Broker (Mosquitto), FastAPI-Backend, Node-RED-Dashboard.
# Werte aus .env (siehe .env.example) werden automatisch interpoliert.

services:
  # ============ MQTT-BROKER ============
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: secureguard-mqtt
    ports:
      - "1883:1883"   # MQTT (App/Gateways)
      - "9001:9001"   # MQTT over WebSocket (optional)
      - "${MOSQUITTO_TLS_PORT:-8883}:8883" # MQTT over TLS (optional)
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
      - ./mosquitto/certs:/mosquitto/certs:ro
    networks:
      - secureguard-network

  # ============ BACKEND-API ============
  backend:
    build: ./backend
    container_name: secureguard-backend
    ports:
      - "${UVICORN_PORT:-8000}:8000"
    environment:
      - DATABASE_PATH=/data/secureguard.db
      - MQTT_BROKER=${MQTT_BROKER:-mqtt:1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_USE_TLS=${MQTT_USE_TLS:-false}
      - MQTT_TLS_CA=${MQTT_TLS_CA:-}
      - API_TOKEN=${API_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      - mqtt
    networks:
      - secureguard-network
    command: uvicorn main:app --host ${UVICORN_HOST:-0.0.0.0} --port ${UVICORN_PORT:-8000} --reload

  # ============ NODE-RED (DASHBOARD) ============
  nodered:
    image: nodered/node-red:latest
    container_name: secureguard-nodered
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./nodered:/data
    networks:
      - secureguard-network

networks:
  secureguard-network:
    driver: bridge
