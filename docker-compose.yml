# SecureGuard Enterprise – Backend-Stack
#   docker compose up --build
#
# Enthält: MQTT-Broker (Mosquitto), FastAPI-Backend, MCP-Server (Temp-Mail),
# Node-RED-Dashboard (Flows: nodered/flows.json).

services:
  # ============ MQTT-BROKER ============
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: secureguard-mqtt
    ports:
      - "1883:1883"   # MQTT (App/Gateways)
      - "9001:9001"   # MQTT over WebSocket (optional)
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      # Prüft, ob der Broker MQTT-Verbindungen annimmt (Image enthält mosquitto_sub).
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 5 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - secureguard-network

  # ============ BACKEND-API ============
  backend:
    build: ./backend
    container_name: secureguard-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/data/secureguard.db
      - MQTT_BROKER=mqtt:1883
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - secureguard-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ============ MCP-SERVER (TEMP-MAIL / OTP) ============
  # Ziel von MCP_SERVER_URL (local.properties) – Tools: create_inbox,
  # wait_for_otp, extract_magic_link (JSON-RPC über WebSocket).
  mcp:
    build: ./backend-mcp
    container_name: secureguard-mcp
    ports:
      - "8001:8001"
    environment:
      - INBOX_TTL_SECONDS=3600
      - MAIL_DOMAIN=temp.secureguard.local
    volumes:
      - ./backend-mcp:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - secureguard-network

  # ============ NODE-RED (DASHBOARD) ============
  nodered:
    image: nodered/node-red:latest
    container_name: secureguard-nodered
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./nodered:/data
    depends_on:
      mqtt:
        condition: service_healthy
    networks:
      - secureguard-network

networks:
  secureguard-network:
    driver: bridge
