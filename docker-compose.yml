# SecureGuard Enterprise – Backend-Stack
#   docker compose up --build
#
# Enthält: MQTT-Broker (Mosquitto), FastAPI-Backend, Node-RED-Dashboard
# und einen einmaligen Seed-Dienst (Demo-Datenbank).
#
# Lokal ohne Docker:  scripts/setup-all.sh && scripts/start-services.sh

services:
  # ============ MQTT-BROKER ============
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: secureguard-mqtt
    ports:
      - "1883:1883"   # MQTT (App/Gateways)
      - "9001:9001"   # MQTT over WebSocket (optional)
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - secureguard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 5 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============ BACKEND-API ============
  backend:
    build: ./backend
    container_name: secureguard-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/data/secureguard.db
      - MQTT_BROKER=mqtt:1883
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      mqtt:
        condition: service_healthy
    networks:
      - secureguard-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============ DEMO-DATEN (einmalig, dann beendet) ============
  seed:
    build: ./backend
    container_name: secureguard-seed
    environment:
      - DATABASE_PATH=/data/secureguard.db
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./scripts:/scripts
    command: python /scripts/seed_backend.py
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - secureguard-network
    restart: "no"

  # ============ NODE-RED (DASHBOARD) ============
  nodered:
    build: ./nodered
    container_name: secureguard-nodered
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Berlin
      - FLOWS=flows.docker.json
      - NODE_RED_CREDENTIAL_SECRET=secureguard-demo
    volumes:
      - ./nodered:/data
    depends_on:
      mqtt:
        condition: service_healthy
    networks:
      - secureguard-network
    restart: unless-stopped

networks:
  secureguard-network:
    driver: bridge
